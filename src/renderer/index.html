<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FOSS Write</title>
    <link rel="stylesheet" href="fw-vendor://app/fonts.css" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' fw-vendor: fw-template: https:; img-src 'self' data: blob: https: http: fw-file: fw-template: fw-vendor:; font-src 'self' data: fw-vendor: fw-template: https:; frame-src 'self' about: fw-template:; connect-src 'self' fw-file: fw-template: fw-vendor: ws:"
    />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar" aria-label="Library"></aside>
      <main id="workspace">
        <header id="titlebar">
          <div class="tb-left">
            <button class="fw-icon-btn" data-cmd="toggleSidebar" title="Library (⌥⌘1)" aria-label="Toggle library">
              <span class="icon"><svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M6 2.5v11" stroke="currentColor" stroke-width="1.2"/></svg></span>
            </button>
          </div>
          <div class="tb-title"><span class="doc-title" title="Click to rename"></span><span class="doc-edited"></span></div>
          <div class="tb-right">
            <button class="fw-icon-btn" data-cmd="toggleOutline" title="Outline (⌥⌘2)" aria-label="Toggle outline">
              <span class="icon"><svg viewBox="0 0 16 16"><path d="M2 3.5h12M4.5 7h9.5M4.5 10.5h9.5M2 14h12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></span>
            </button>
            <button class="fw-icon-btn" data-cmd="togglePreview" title="Preview (⌘R)" aria-label="Toggle preview">
              <span class="icon"><svg viewBox="0 0 16 16"><path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="8" cy="8" r="2" fill="currentColor"/></svg></span>
            </button>
          </div>
        </header>
        <div id="panes">
          <div id="editor"></div>
          <div id="preview"></div>
          <aside id="outline"></aside>
        </div>
        <footer id="statusbar"></footer>
      </main>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
